services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://openboard:openboard@db:5432/openboard
      ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openboard
      POSTGRES_PASSWORD: openboard
      POSTGRES_DB: openboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openboard']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
