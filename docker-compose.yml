services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://openboard:openboard@db:5432/openboard
      # Required. Compose fails fast with this message when the variable is
      # missing, so put it in .env before running docker compose up.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      # Public URL of the deployment. Override in .env when not on localhost.
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      # Optional SMTP relay for outgoing mail. Blank defaults keep the
      # variables present but empty, which the mailer treats as disabled.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Node's own fetch instead of curl or wget: neither is a safe bet in
      # the runtime image. Any non-2xx answer fails the check, including the
      # 503 the endpoint returns while the database is unreachable.
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/health')
          .then((r) => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openboard
      POSTGRES_PASSWORD: openboard
      POSTGRES_DB: openboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openboard']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
